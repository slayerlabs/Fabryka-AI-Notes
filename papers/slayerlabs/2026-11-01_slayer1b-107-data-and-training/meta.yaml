notes: "Working draft v0.4.6 of the data and training plan for continuing Slayer 1B from 1.06 (14.52 billion tokens, step 13 848) on the prepared 1.07 set (8 891 005 707 tokens in 9 files). Covers sources and licences, personal-data masking, test-leakage removal, the evaluation track, the batch-1 probe, and cost and data logistics. The 1.07 training run itself had not started at the time of this version. paper_pl.pdf is the same report in Polish. Public payload is PDF and metadata only."
