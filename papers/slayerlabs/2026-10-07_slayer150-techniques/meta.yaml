notes: "Technical report, draft. How the recipe of Slayer 150 1.01 (139.3M parameters, 24k vocabulary, WSD with a 20% decay, about 24.7B unique tokens) was chosen: nine 64M / 2B-token ablations, each judged by a rule written before its result and computed by two independent implementations; one accepted (24k vocabulary), five rejected, three inconclusive or default. Lists the rule changes made before results. Reports that under one shared harness 11 of 12 top leaderboard entries score lower than their self-reported numbers, attributed to differences between evaluation setups. LaTeX sources in en/ and pl/ (slay-paper formatka c2497c79); recipe/ lists the hashes of the scripts and result files behind every number. paper_pl.pdf is the same report in Polish."
